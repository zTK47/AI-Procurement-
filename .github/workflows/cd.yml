name: CD

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.CD_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      APP_URL: ${{ vars.APP_URL }}
      EXPECTED_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_VERSION }}

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "Secret RENDER_DEPLOY_HOOK_URL is missing"; exit 1; }
          test -n "$APP_URL" || { echo "Variable APP_URL is missing"; exit 1; }
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy of $EXPECTED_VERSION triggered"

      - name: Wait until the new version is live
        run: |
          for i in $(seq 1 60); do
            version=$(curl -fsS -m 30 "$APP_URL/api/health" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)
            echo "attempt $i: live version '${version}'"
            if [ "$version" = "$EXPECTED_VERSION" ]; then exit 0; fi
            sleep 15
          done
          echo "Version $EXPECTED_VERSION did not go live within 15 minutes"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Post-deployment smoke tests (read-only)
        env:
          E2E_BASE_URL: ${{ vars.APP_URL }}
        run: |
          pip install pytest==9.1.1 httpx==0.28.1
          python -m pytest tests/e2e -m readonly -v
