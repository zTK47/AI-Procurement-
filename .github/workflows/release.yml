name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required AI-SDLC artefacts
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/PROJECT.md
          test -f docs/TASKS.md
          test -f docs/specs/UC-TEMPLATE.md
          test -f .github/copilot-instructions.md
          test -d skills

      - name: Check whitespace errors
        run: git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit and integration tests
        run: python -m pytest tests/unit tests/integration

  image:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: meta
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/procai" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg PYTHON_VERSION="$(cat .python-version)" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            -t procai:test .

      - name: Start container
        run: |
          docker run -d --name procai -p 8000:8000 -e PARSER=rules procai:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs procai
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: E2E tests against the container
        env:
          E2E_BASE_URL: http://localhost:8000
        run: |
          pip install pytest==9.1.1 httpx==0.28.1
          python -m pytest tests/e2e -v

      - name: Container logs
        if: always()
        run: docker logs procai || true

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ github.ref_name }}
        run: |
          docker tag procai:test "$IMAGE:$TAG"
          docker tag procai:test "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Docker image: `${{ needs.image.outputs.image }}:${{ github.ref_name }}`

            ```bash
            docker run --rm -p 8000:8000 --env-file .env ${{ needs.image.outputs.image }}:${{ github.ref_name }}
            ```
